<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Student Planner</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#f5f3ff,#eef2ff 50%,#f0f9ff);min-height:100vh}
.dark body{background:linear-gradient(135deg,#0b0b1a,#12122b 60%,#0b1220)}
.fade{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cf{position:fixed;top:40%;font-size:22px;animation:cf 1.6s ease-out forwards;pointer-events:none;z-index:99}
@keyframes cf{to{transform:translate(var(--x),300px) rotate(540deg);opacity:0}}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#c4b5fd;border-radius:9px}
</style>
</head>
<body class="text-slate-800 dark:text-slate-100"><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const add=(n,b=new Date())=>{const x=new Date(b);x.setDate(x.getDate()+n);return iso(x)};
const dd=s=>Math.round((new Date(s+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const P={home:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",spark:"M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z M19 16v4 M17 18h4",check:"M20 6L9 17l-5-5",cal:"M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18",book:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8",msg:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",target:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12 M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4",note:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6",set:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2",trophy:"M6 9H4.5a2.5 2.5 0 0 1 0-5H6 M18 9h1.5a2.5 2.5 0 0 0 0-5H18 M4 22h16 M10 14.66V17 M14 14.66V17 M18 2H6v7a6 6 0 0 0 12 0z",plus:"M12 5v14 M5 12h14",trash:"M3 6h18 M19 6l-1 14H6L5 6 M10 11v6 M14 11v6 M9 6V4h6v2",moon:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10 M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4",pin:"M12 17v5 M9 10.8V4h6v6.8l3 4.2H6z",x:"M18 6L6 18 M6 6l12 12",send:"M22 2L11 13 M22 2l-7 20-4-9-9-4z",flame:"M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 2 4-5z",clock:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 6v6l4 2",play:"M5 3l14 9-14 9z",edit:"M17 3l4 4L7 21H3v-4z",alert:"M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",chev:"M9 18l6-6-6-6",chevl:"M15 18l-6-6 6-6"};
const I=({n,c="w-5 h-5"})=><svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={P[n]}/></svg>;
const COL=["#8b5cf6","#3b82f6","#ec4899","#10b981","#f59e0b","#06b6d4","#ef4444"];
const card="rounded-2xl bg-white/80 dark:bg-slate-900/70 backdrop-blur border border-violet-100 dark:border-slate-800 shadow-sm p-5 fade";
const btn="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-500 text-white text-sm font-semibold shadow hover:shadow-lg hover:-translate-y-px active:scale-95 transition";
const btn2="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-violet-200 dark:border-slate-700 text-sm font-medium hover:bg-violet-50 dark:hover:bg-slate-800 transition";
const inp="w-full px-3 py-2 rounded-xl border border-violet-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-violet-400";
const QUOTES=["Small steps every day lead to big results.","Discipline is choosing what you want most over what you want now.","Study hard now, celebrate later.","Progress, not perfection."];
const seed=()=>{const S=[{id:"s1",name:"Mathematics",color:COL[0],diff:5},{id:"s2",name:"Physics",color:COL[1],diff:4},{id:"s3",name:"Data Structures",color:COL[2],diff:4},{id:"s4",name:"English Literature",color:COL[3],diff:2},{id:"s5",name:"Chemistry",color:COL[4],diff:3}];
return{v:1,dark:false,prof:{name:"Aarav",hours:3,start:"17:00",goal:4,target:75,wgoal:15,notif:true},subjects:S,
att:{s1:{a:18,t:22},s2:{a:14,t:20},s3:{a:21,t:24},s4:{a:9,t:12},s5:{a:12,t:18}},
tt:[[1,"09:00","s1"],[1,"11:00","s3"],[2,"10:00","s2"],[2,"14:00","s5"],[3,"09:00","s1"],[3,"13:00","s4"],[4,"10:00","s3"],[4,"15:00","s2"],[5,"09:00","s5"],[5,"12:00","s4"],[0,"10:00","s3"],[6,"10:00","s1"]],
tasks:[{id:"t1",title:"Calculus problem set 5",subj:"s1",due:add(1),pri:"High",done:false},{id:"t2",title:"Physics lab report",subj:"s2",due:add(3),pri:"Medium",done:false},{id:"t3",title:"Implement AVL tree",subj:"s3",due:add(5),pri:"High",done:false},{id:"t4",title:"Essay on Modernism",subj:"s4",due:add(7),pri:"Low",done:false},{id:"t5",title:"Organic reactions worksheet",subj:"s5",due:add(-1),pri:"Medium",done:true}],
exams:[{id:"e1",subj:"s1",date:add(12),topics:[{t:"Limits & continuity",d:true},{t:"Differentiation",d:true},{t:"Integration",d:false},{t:"Series",d:false},{t:"Differential equations",d:false}]},{id:"e2",subj:"s3",date:add(20),topics:[{t:"Arrays & lists",d:true},{t:"Trees",d:false},{t:"Graphs",d:false},{t:"Sorting",d:false}]},{id:"e3",subj:"s2",date:add(28),topics:[{t:"Kinematics",d:true},{t:"Optics",d:false},{t:"Thermodynamics",d:false}]}],
notes:[{id:"n1",title:"Integration by parts",subj:"s1",body:"∫u dv = uv − ∫v du\nPick u using LIATE.",pin:true},{id:"n2",title:"Big-O cheat sheet",subj:"s3",body:"Binary search O(log n)\nMerge sort O(n log n)\nHash lookup O(1) avg",pin:false},{id:"n3",title:"Snell's law",subj:"s2",body:"n1 sin θ1 = n2 sin θ2",pin:false}],
events:[{id:"v1",title:"Study group",date:add(2),type:"study",time:"16:00"}],
sessions:[],goals:[{id:"g1",t:"Revise 1 chapter",d:false},{id:"g2",t:"Finish 1 assignment",d:false},{id:"g3",t:"Review notes 20 min",d:false}],gday:iso(new Date()),
study:Object.fromEntries([90,120,60,150,45,100,0].map((m,i)=>[add(-6+i),m])),pts:240,streak:3,last:add(-1),done:{tasks:12,pom:4}}};
function useStore(){const[D,S]=useState(()=>{try{const r=localStorage.getItem("ssp1");if(r)return JSON.parse(r)}catch(e){}return seed()});
useEffect(()=>{try{localStorage.setItem("ssp1",JSON.stringify(D))}catch(e){}document.documentElement.classList.toggle("dark",D.dark)},[D]);
useEffect(()=>{S(p=>{const t=iso(new Date());let n={...p};if(p.last!==t){n.streak=p.last===add(-1)?p.streak+1:1;n.last=t}if(p.gday!==t){n.gday=t;n.goals=p.goals.map(g=>({...g,d:false}))}return n})},[]);
return[D,S]}
const Modal=({title,onClose,children})=><div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 p-3" onClick={onClose}><div className={card+" w-full max-w-md max-h-[90vh] overflow-auto !bg-white dark:!bg-slate-900"} onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg">{title}</h3><button onClick={onClose} className="p-1 rounded-lg hover:bg-violet-50 dark:hover:bg-slate-800"><I n="x"/></button></div>{children}</div></div>;
const F=({l,children,err})=><label className="block mb-3 text-xs font-semibold text-slate-500 dark:text-slate-400">{l}<div className="mt-1 font-normal">{children}</div>{err&&<div className="text-red-500 mt-1">{err}</div>}</label>;
const Bar=({v,c="#8b5cf6"})=><div className="h-2 rounded-full bg-violet-100 dark:bg-slate-800 overflow-hidden"><div className="h-full rounded-full transition-all duration-700" style={{width:Math.min(100,v)+"%",background:c}}/></div>;
const Head=({t,s,children})=><div className="flex flex-wrap items-center justify-between gap-3 mb-5 fade"><div><h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-violet-600 to-blue-500 bg-clip-text text-transparent">{t}</h1><p className="text-sm text-slate-500">{s}</p></div><div className="flex gap-2 flex-wrap">{children}</div></div>;
const Chip=({c,children})=><span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{background:c+"22",color:c}}>{children}</span>;
const sub=(D,id)=>D.subjects.find(s=>s.id===id)||{name:"General",color:"#94a3b8",diff:3};

function Chart({data,h=140}){const mx=Math.max(60,...data.map(d=>d.v));return<svg viewBox={`0 0 ${data.length*50} ${h+24}`} className="w-full">{data.map((d,i)=>{const bh=d.v/mx*h;return<g key={i}><rect x={i*50+8} y={h-bh} width="34" height={bh} rx="8" fill={d.c||"#8b5cf6"} opacity=".9"><animate attributeName="height" from="0" to={bh} dur=".6s"/><animate attributeName="y" from={h} to={h-bh} dur=".6s"/></rect><text x={i*50+25} y={h+16} textAnchor="middle" fontSize="11" fill="#94a3b8">{d.l}</text><text x={i*50+25} y={h-bh-4} textAnchor="middle" fontSize="10" fill="#7c3aed">{d.v?Math.round(d.v/6)/10+"h":""}</text></g>})}</svg>}
const Ring=({v,size=96,c="#8b5cf6"})=>{const r=40,C=2*Math.PI*r;return<svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r={r} fill="none" stroke="#ddd6fe55" strokeWidth="10"/><circle cx="50" cy="50" r={r} fill="none" stroke={c} strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-Math.min(100,v)/100)} transform="rotate(-90 50 50)" style={{transition:"all 1s"}}/><text x="50" y="57" textAnchor="middle" fontSize="22" fontWeight="800" fill="currentColor">{Math.round(v)}</text></svg>};

/* ---------- Dashboard ---------- */
function Dashboard({D,up,go,award}){
const[now,setNow]=useState(new Date());useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t)},[]);
const h=now.getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
const today=D.tt.filter(c=>c[0]===now.getDay()).sort((a,b)=>a[1]>b[1]?1:-1);
const pend=D.tasks.filter(t=>!t.done).sort((a,b)=>a.due>b.due?1:-1);
const avgAtt=D.subjects.reduce((s,x)=>s+(D.att[x.id]?D.att[x.id].a/D.att[x.id].t:0),0)/D.subjects.length*100;
const tr=D.tasks.length?D.tasks.filter(t=>t.done).length/D.tasks.length*100:0,gr=D.goals.filter(x=>x.d).length/D.goals.length*100;
const score=tr*.4+Math.min(100,avgAtt)*.3+gr*.3;
const week=[...Array(7)].map((_,i)=>{const d=add(-6+i);return{l:new Date(d+"T00:00").toLocaleDateString("en",{weekday:"short"}),v:D.study[d]||0,c:i===6?"#3b82f6":"#8b5cf6"}});
const toggleGoal=id=>{const x=D.goals.find(g=>g.id===id);up({goals:D.goals.map(g=>g.id===id?{...g,d:!g.d}:g)});if(!x.d)award(5,"Goal complete! +5 pts")};
return<div>
<div className="rounded-3xl p-6 sm:p-8 mb-5 text-white bg-gradient-to-br from-violet-600 via-indigo-500 to-blue-500 shadow-xl fade relative overflow-hidden">
<div className="absolute -right-10 -top-10 w-48 h-48 rounded-full bg-white/10"/>
<div className="flex flex-wrap justify-between gap-4 relative"><div><p className="text-violet-100 text-sm">{now.toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
<h1 className="text-3xl sm:text-4xl font-extrabold mt-1">{g}, {D.prof.name} 👋</h1><p className="mt-2 text-violet-100 max-w-md italic">“{QUOTES[now.getDate()%QUOTES.length]}”</p></div>
<div className="text-right"><div className="text-4xl sm:text-5xl font-extrabold tabular-nums">{now.toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit"})}</div><div className="mt-2 inline-flex items-center gap-1 bg-white/20 rounded-full px-3 py-1 text-sm"><I n="flame" c="w-4 h-4"/>{D.streak} day streak · {D.pts} pts</div></div></div></div>
<div className="flex flex-wrap gap-2 mb-5">{[["spark","Generate plan","planner"],["plus","Add task","tasks"],["msg","Ask AI","ai"],["note","New note","notes"],["users","Mark attendance","attendance"]].map(([i,l,p])=><button key={p} onClick={()=>go(p)} className={btn2+" bg-white/70 dark:bg-slate-900/60"}><I n={i} c="w-4 h-4"/>{l}</button>)}</div>
<div className="grid lg:grid-cols-3 gap-5">
<div className={card+" flex items-center gap-5"}><Ring v={score}/><div><h3 className="font-bold">Productivity score</h3><p className="text-sm text-slate-500">Tasks 40% · Attendance 30% · Goals 30%</p><p className="text-sm mt-1 text-violet-600 font-semibold">{score>70?"Excellent momentum!":"Room to grow — you've got this."}</p></div></div>
<div className={card+" lg:col-span-2"}><h3 className="font-bold mb-2">Weekly study time</h3><Chart data={week}/></div>
<div className={card}><h3 className="font-bold mb-3">Today's classes</h3>{today.length?today.map((c,i)=>{const s=sub(D,c[2]);return<div key={i} className="flex items-center gap-3 py-2"><div className="w-1 h-9 rounded" style={{background:s.color}}/><div><div className="font-semibold text-sm">{s.name}</div><div className="text-xs text-slate-500">{c[1]}</div></div></div>}):<p className="text-sm text-slate-500">No classes today 🎉</p>}</div>
<div className={card}><h3 className="font-bold mb-3">Upcoming deadlines</h3>{pend.slice(0,4).map(t=>{const d=dd(t.due);return<div key={t.id} className="flex justify-between items-center py-2 text-sm"><span className="truncate pr-2">{t.title}</span><Chip c={d<0?"#ef4444":d<=1?"#f59e0b":"#8b5cf6"}>{d<0?"Overdue":d===0?"Today":d+"d"}</Chip></div>})||null}{!pend.length&&<p className="text-sm text-slate-500">All caught up ✨</p>}</div>
<div className={card}><h3 className="font-bold mb-3">Daily goals</h3>{D.goals.map(x=><button key={x.id} onClick={()=>toggleGoal(x.id)} className="flex items-center gap-3 w-full py-2 text-left text-sm"><span className={"w-5 h-5 rounded-md border-2 grid place-items-center transition "+(x.d?"bg-violet-600 border-violet-600 text-white":"border-violet-300")}>{x.d&&<I n="check" c="w-3 h-3"/>}</span><span className={x.d?"line-through text-slate-400":""}>{x.t}</span></button>)}</div>
<div className={card+" lg:col-span-3"}><h3 className="font-bold mb-3">Exam countdowns</h3><div className="grid sm:grid-cols-3 gap-4">{[...D.exams].sort((a,b)=>a.date>b.date?1:-1).map(e=>{const s=sub(D,e.subj);return<div key={e.id} className="rounded-xl p-4" style={{background:s.color+"14"}}><div className="text-xs font-semibold" style={{color:s.color}}>{s.name}</div><div className="text-3xl font-extrabold">{Math.max(0,dd(e.date))}<span className="text-sm font-medium text-slate-500"> days</span></div></div>})}</div></div>
</div></div>}

/* ---------- AI Planner ---------- */
function Planner({D,up,award,toast}){
const[hours,setH]=useState(D.prof.hours),[days,setDays]=useState(7);
const gen=()=>{const pr=D.subjects.map(s=>{const ex=D.exams.find(e=>e.subj===s.id),dl=ex?Math.max(0,dd(ex.date)):30;const rem=ex?ex.topics.filter(t=>!t.d).length:1;return{s,w:s.diff*2+Math.max(0,30-dl)/2+rem}});
const tw=pr.reduce((a,b)=>a+b.w,0);const out=[];
for(let d=0;d<days;d++){let m=hours*60,tm=+D.prof.start.slice(0,2)*60+ +D.prof.start.slice(3);const q=[...pr].sort((a,b)=>b.w-a.w);const slots=[];q.forEach(p=>{const n=Math.round(p.w/tw*hours*60/45);for(let k=0;k<Math.max(1,n);k++)slots.push(p.s)});
const order=slots.filter((_,i)=>(i+d)%1===0);const rot=order.slice(d%order.length).concat(order.slice(0,d%order.length));
let used=0;for(const s of rot){if(used+45>m+10)break;out.push({id:uid(),date:add(d),time:String(Math.floor(tm/60)).padStart(2,"0")+":"+String(tm%60).padStart(2,"0"),subj:s.id,min:45,st:"todo"});tm+=55;used+=55}}
up({sessions:out});award(10,"Plan generated ✨")};
const mark=(id,st)=>{const x=D.sessions.find(s=>s.id===id);let ss=D.sessions.map(s=>s.id===id?{...s,st}:s);
if(st==="done"){up({sessions:ss,study:{...D.study,[x.date]:(D.study[x.date]||0)+x.min}});award(10,"Session done! +10 pts")}
else{const nd=add(1,new Date(x.date+"T00:00"));ss=[...ss,{...x,id:uid(),date:nd,st:"todo",re:true}];up({sessions:ss});toast("Missed session rescheduled to "+nd)}};
const grp={};D.sessions.forEach(s=>(grp[s.date]=grp[s.date]||[]).push(s));
return<div><Head t="AI Study Planner" s="Priority = difficulty × exam proximity × remaining topics"/>
<div className={card+" mb-5 grid sm:grid-cols-4 gap-4 items-end"}><F l={`Hours per day: ${hours}h`}><input type="range" min="1" max="8" value={hours} onChange={e=>setH(+e.target.value)} className="w-full accent-violet-600"/></F><F l="Days"><select className={inp} value={days} onChange={e=>setDays(+e.target.value)}><option value={1}>Today</option><option value={7}>Week</option></select></F><div className="text-xs text-slate-500 pb-3">Starts {D.prof.start} · 10-min breaks · {D.subjects.length} subjects</div><button className={btn+" mb-3 justify-center"} onClick={gen}><I n="spark" c="w-4 h-4"/>Generate plan</button></div>
{!D.sessions.length&&<div className={card+" text-center text-slate-500"}>No plan yet — hit Generate to build your schedule.</div>}
<div className="grid md:grid-cols-2 gap-5">{Object.keys(grp).sort().map(d=><div key={d} className={card}><h3 className="font-bold mb-3">{new Date(d+"T00:00").toLocaleDateString("en",{weekday:"long",day:"numeric",month:"short"})}</h3>{grp[d].sort((a,b)=>a.time>b.time?1:-1).map(s=>{const sb=sub(D,s.subj);return<div key={s.id} className="mb-2"><div className={"flex items-center gap-3 p-2 rounded-xl "+(s.st==="done"?"opacity-50":"")} style={{background:sb.color+"14"}}><div className="text-xs font-mono w-12">{s.time}</div><div className="flex-1 text-sm font-semibold">{sb.name}{s.re&&<span className="text-[10px] text-amber-600 ml-2">rescheduled</span>}<div className="text-[11px] font-normal text-slate-500">{s.min} min focus</div></div>
{s.st==="todo"?<><button title="Done" onClick={()=>mark(s.id,"done")} className="p-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:scale-110 transition"><I n="check" c="w-4 h-4"/></button><button title="Missed" onClick={()=>mark(s.id,"missed")} className="p-1.5 rounded-lg bg-red-100 text-red-600 hover:scale-110 transition"><I n="x" c="w-4 h-4"/></button></>:<Chip c={s.st==="done"?"#10b981":"#ef4444"}>{s.st}</Chip>}</div><div className="text-[11px] text-slate-400 pl-4 py-0.5">☕ 10 min break</div></div>})}</div>)}</div></div>}

/* ---------- Attendance ---------- */
function Attendance({D,up,award}){
const T=D.prof.target,set=(id,a,t)=>up({att:{...D.att,[id]:{a:Math.max(0,a),t:Math.max(0,t)}}});
return<div><Head t="Attendance" s={`Target ${T}% — adjustable in Settings`}/>

/* ---------- AI Assistant ---------- */
function AI({D}){

const send=async(text=q)=>{if(!text.trim()||busy)return;setQ("");const h=[...msgs,{role:"user",content:text}];setMsgs([...h,{role:"assistant",content:"…"}]);setBusy(true);

const r=await sample(hist,{cache:false,onText:({text})=>setMsgs([...h,{role:"assistant",content:text}])});setMsgs([...h,{role:"assistant",content:r.text}])}
catch(e){setMsgs([...h,{role:"assistant",content:e&&e.code==="not_granted"?"AI access was declined. Allow it from the artifact's Permissions menu to chat.":"The AI tutor is only available when the app is opened in Claude (keys are never stored in the page)."}])}
setBusy(false)};

<div className={card+" flex-1 overflow-auto space-y-3"}>{msgs.map((m,i)=><div key={i} className={"flex "+(m.role==="user"?"justify-end":"")}><div className={"max-w-[85%] px-4 py-2.5 rounded-2xl text-sm whitespace-pre-wrap "+(m.role==="user"?"bg-gradient-to-r from-violet-600 to-indigo-500 text-white":"bg-violet-50 dark:bg-slate-800")}>{m.content}</div></div>)}<div ref={end}/></div>

/* ---------- Achievements ---------- */
function Achievements({D}){const lvl=Math.floor(D.pts/200)+1,wk=Object.keys(D.study).filter(k=>dd(k)>-7).reduce((a,k)=>a+D.study[k],0)/60;
const B=[["🔥","On Fire","3-day streak",D.streak>=3],["⚡","Week Warrior","7-day streak",D.streak>=7],["✅","Task Master","Complete 10 tasks",D.done.tasks>=10],["🍅","Focus Hero","5 Pomodoros",D.done.pom>=5],["💎","Point Collector","500 points",D.pts>=500],["📚","Scholar","10h this week",wk>=10],["🎯","Goal Getter","Finish all daily goals",D.goals.every(g=>g.d)],["🏆","Legend","1000 points",D.pts>=1000]];
return<div><Head t="Achievements" s="Earn points, build streaks, unlock badges"/>
<div className="grid md:grid-cols-3 gap-5 mb-5"><div className={card+" text-center"}><div className="text-5xl">🔥</div><div className="text-4xl font-extrabold">{D.streak}</div><div className="text-sm text-slate-500">day streak</div></div><div className={card}><div className="text-sm text-slate-500">Level {lvl}</div><div className="text-3xl font-extrabold">{D.pts} pts</div><div className="mt-3"><Bar v={D.pts%200/2}/></div><div className="text-xs text-slate-400 mt-1">{200-D.pts%200} pts to level {lvl+1}</div></div><div className={card}><div className="text-sm text-slate-500">Weekly goal</div><div className="text-3xl font-extrabold">{wk.toFixed(1)}<span className="text-base text-slate-400">/{D.prof.wgoal}h</span></div><div className="mt-3"><Bar v={wk/D.prof.wgoal*100} c="#3b82f6"/></div></div></div>
<div className="grid grid-cols-2 md:grid-cols-4 gap-4">{B.map(([e,t,d,ok])=><div key={t} className={card+" text-center !p-4 "+(ok?"":"opacity-40 grayscale")}><div className="text-4xl">{e}</div><div className="font-bold text-sm mt-1">{t}</div><div className="text-[11px] text-slate-500">{d}</div></div>)}</div></div>}

/* ---------- Settings ---------- */
function Settings({D,up,toast}){const[p,setP]=useState(D.prof),[ns,setNs]=useState("");
return<div><Head t="Settings" s="Personalise your planner"/><div className="grid lg:grid-cols-2 gap-5">
<div className={card}><h3 className="font-bold mb-3">Profile & study</h3><F l="Name"><input className={inp} value={p.name} onChange={e=>setP({...p,name:e.target.value})}/></F><div className="grid grid-cols-2 gap-3"><F l="Study hours/day"><input type="number" min="1" max="12" className={inp} value={p.hours} onChange={e=>setP({...p,hours:+e.target.value})}/></F><F l="Preferred start"><input type="time" className={inp} value={p.start} onChange={e=>setP({...p,start:e.target.value})}/></F><F l="Attendance target %"><input type="number" min="50" max="95" className={inp} value={p.target} onChange={e=>setP({...p,target:+e.target.value})}/></F><F l="Weekly goal (h)"><input type="number" min="1" className={inp} value={p.wgoal} onChange={e=>setP({...p,wgoal:+e.target.value})}/></F></div>
<label className="flex items-center gap-2 text-sm mb-4"><input type="checkbox" className="accent-violet-600" checked={p.notif} onChange={async e=>{setP({...p,notif:e.target.checked});if(e.target.checked&&"Notification" in window)try{Notification.requestPermission()}catch(x){}}}/>Deadline notifications</label>
<button className={btn} onClick={()=>{if(!p.name.trim()||p.hours<1||p.target<1)return toast("Please enter valid values");up({prof:p});toast("Settings saved")}}>Save changes</button></div>
<div className={card}><h3 className="font-bold mb-3">Subjects</h3>{D.subjects.map(s=><div key={s.id} className="flex items-center gap-3 py-1.5"><span className="w-3 h-3 rounded-full" style={{background:s.color}}/><span className="flex-1 text-sm">{s.name}</span><select className="text-xs bg-transparent border rounded-lg px-1 py-1" value={s.diff} onChange={e=>up({subjects:D.subjects.map(x=>x.id===s.id?{...x,diff:+e.target.value}:x)})}>{[1,2,3,4,5].map(n=><option key={n} value={n}>Difficulty {n}</option>)}</select><button className="text-red-500" onClick={()=>up({subjects:D.subjects.filter(x=>x.id!==s.id)})}><I n="trash" c="w-4 h-4"/></button></div>)}
<div className="flex gap-2 mt-3"><input className={inp} placeholder="New subject" value={ns} onChange={e=>setNs(e.target.value)}/><button className={btn} onClick={()=>{if(!ns.trim())return;const id=uid();up({subjects:[...D.subjects,{id,name:ns,color:COL[D.subjects.length%7],diff:3}],att:{...D.att,[id]:{a:0,t:0}}});setNs("")}}><I n="plus" c="w-4 h-4"/></button></div>
<button className={btn2+" mt-6 text-red-500"} onClick={()=>{if(confirm("Reset all data to demo content?")){up(seed(),true)}}}>Reset demo data</button></div></div></div>}

/* ---------- Shell ---------- */
const NAV=[["dashboard","Dashboard","home"],["planner","AI Planner","spark"],["attendance","Attendance","users"],["tasks","Assignments","check"],["ai","AI Assistant","msg"],["exams","Exam Center","target"],["notes","Notes","note"],["calendar","Calendar","cal"],["rewards","Achievements","trophy"],["settings","Settings","set"]];
function App(){const[D,S]=useStore(),[page,setPage]=useState("dashboard"),[toasts,setT]=useState([]),[cf,setCf]=useState(false);
const up=(p,full)=>S(prev=>full?p:{...prev,...p});
const toast=m=>{const id=uid();setT(t=>[...t,{id,m}]);setTimeout(()=>setT(t=>t.filter(x=>x.id!==id)),2800)};
const award=(n,m,big)=>{S(p=>({...p,pts:p.pts+n}));toast(m);if(big){setCf(true);setTimeout(()=>setCf(false),1700)}};
const go=p=>{setPage(p);window.scrollTo(0,0)};
const props={D,up,award,toast,go};
const Pg={dashboard:Dashboard,planner:Planner,attendance:Attendance,tasks:Tasks,ai:AI,exams:Exams,notes:Notes,calendar:Calendar,rewards:Achievements,settings:Settings}[page];
return<div className="flex min-h-screen">
<aside className="hidden md:flex w-60 shrink-0 flex-col p-4 border-r border-violet-100 dark:border-slate-800 bg-white/60 dark:bg-slate-950/60 backdrop-blur sticky top-0 h-screen">
<div className="flex items-center gap-2 px-2 mb-6"><div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-blue-500 grid place-items-center text-white"><I n="spark"/></div><div className="font-extrabold leading-tight">Smart Student<br/><span className="text-violet-600">Planner</span></div></div>
<nav className="flex-1 space-y-1 overflow-auto">{NAV.map(([k,l,i])=><button key={k} onClick={()=>go(k)} className={"w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium transition "+(page===k?"bg-gradient-to-r from-violet-600 to-indigo-500 text-white shadow":"hover:bg-violet-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300")}><I n={i} c="w-4 h-4"/>{l}</button>)}</nav>
<button onClick={()=>up({dark:!D.dark})} className={btn2+" justify-center mt-3"}><I n={D.dark?"sun":"moon"} c="w-4 h-4"/>{D.dark?"Light":"Dark"} mode</button></aside>
<main className="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 pb-24 md:pb-8 max-w-6xl mx-auto"><div className="md:hidden flex justify-between items-center mb-4"><div className="font-extrabold text-violet-600">Smart Student Planner</div><button onClick={()=>up({dark:!D.dark})} className="p-2 rounded-xl border border-violet-200 dark:border-slate-700"><I n={D.dark?"sun":"moon"} c="w-4 h-4"/></button></div><Pg key={page} {...props}/></main>
<nav className="md:hidden fixed bottom-0 inset-x-0 z-40 flex overflow-x-auto gap-1 p-2 bg-white/90 dark:bg-slate-950/90 backdrop-blur border-t border-violet-100 dark:border-slate-800" style={{paddingBottom:"calc(.5rem + env(safe-area-inset-bottom,0px))"}}>{NAV.map(([k,l,i])=><button key={k} onClick={()=>go(k)} className={"flex flex-col items-center min-w-[64px] px-2 py-1 rounded-xl text-[10px] "+(page===k?"bg-violet-600 text-white":"text-slate-500")}><I n={i} c="w-5 h-5"/>{l.split(" ").pop()}</button>)}</nav>
<div className="fixed top-4 right-4 z-[60] space-y-2">{toasts.map(t=><div key={t.id} className="fade px-4 py-2 rounded-xl bg-slate-900 text-white text-sm shadow-xl">{t.m}</div>)}</div>
{cf&&[...Array(24)].map((_,i)=><span key={i} className="cf" style={{left:(20+i*3)+"%","--x":(Math.random()*160-80)+"px",animationDelay:Math.random()*.3+"s"}}>{["🎉","✨","⭐","💜"][i%4]}</span>)}
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
